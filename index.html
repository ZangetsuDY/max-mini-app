<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Россети Ленэнерго</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background">
    <div class="blur-circle blur-circle-1"></div>
    <div class="blur-circle blur-circle-2"></div>
    <div class="blur-circle blur-circle-3"></div>
  </div>

  <main class="app">
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <p class="eyebrow">МИНИ-ПРИЛОЖЕНИЕ</p>
          <h1>ПАО «Россети Ленэнерго»</h1>
          <p class="subtitle">
            Корпоративная панель мониторинга отключений
          </p>
        </div>

        <div class="status-badge">
          Онлайн
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="panel-icon">⚡</div>
          <div>
            <h2>Интерфейс отключений</h2>
            <p class="panel-description">
              Быстрый доступ к разделу контроля текущих отключений
            </p>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <span class="stat-label">Всего отключений</span>
            <span class="stat-value">117</span>
          </div>
        </div>

        <button id="openOutagesBtn" class="primary-button">
          Открыть интерфейс отключений
        </button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
